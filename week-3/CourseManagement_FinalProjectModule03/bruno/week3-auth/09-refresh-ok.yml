info:
  name: "09 - Refresh token (200)"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  body:
    type: json
    data: "{\"refreshToken\":\"{{refreshToken}}\"}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 20000
  followRedirects: true
  maxRedirects: 5
