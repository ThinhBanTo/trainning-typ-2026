info:
  name: Login(1)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: "{\r

      \    \"username\":\"{{username}}\",\r

      \    \"password\":\"{{password}}\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
