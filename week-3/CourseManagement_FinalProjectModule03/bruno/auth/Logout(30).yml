info:
  name: Logout(30)
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/auth/logout"
  body:
    type: json
    data: "{\"refreshToken\":\"{{refreshToken}}\"}"
  auth:
    type: bearer
    token: "{{studentToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
