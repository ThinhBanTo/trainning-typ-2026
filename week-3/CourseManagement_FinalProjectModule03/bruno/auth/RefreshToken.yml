info:
  name: RefreshToken
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  body:
    type: json
    data: "{\r

      \    \"refreshToken\":\"{{refreshToken}}\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
