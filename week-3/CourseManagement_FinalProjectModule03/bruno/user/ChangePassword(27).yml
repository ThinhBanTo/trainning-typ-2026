http:
  method: PUT
  url: "{{baseUrl}}/api/users/5/password"
  body:
    type: json
    data: "{\r

      \    \"oldPassword\":\"123456\",\r

      \    \"newPassword\":\"{{newPassword}}\",\r

      \    \"confirmPassword\":\"654321\"\r

      }"
  auth:
    type: bearer
    token: "{{studentToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
