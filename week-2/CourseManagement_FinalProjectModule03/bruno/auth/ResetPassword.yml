info:
  name: ResetPassword
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/auth/reset-password"
  body:
    type: json
    data: "{\r

      \    \"otp\":\"{{otp}}\",\r

      \    \"email\":\"{{email}}\",\r

      \    \"newPassword\":\"{{newPassword}}\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
