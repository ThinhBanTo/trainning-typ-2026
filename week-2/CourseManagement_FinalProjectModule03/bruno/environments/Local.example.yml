name: Local Example
variables:
  - name: baseUrl
    value: http://localhost:8080
  - name: username
    value: admin
  - name: password
    value: "123456"
  - name: email
    value: student@example.com
  - name: otp
    value: REPLACE_WITH_OTP_FROM_EMAIL
  - name: newPassword
    value: REPLACE_WITH_NEW_PASSWORD
  - name: refreshToken
    value: REPLACE_WITH_REFRESH_TOKEN
  - name: adminToken
    value: REPLACE_WITH_ADMIN_ACCESS_TOKEN
