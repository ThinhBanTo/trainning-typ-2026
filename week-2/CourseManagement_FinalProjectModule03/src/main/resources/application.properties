spring.application.name=CourseManagement_FinalProjectModule03
#beautify body
spring.jackson.serialization.indent-output=true
#page_json
spring.data.web.pageable.serialization-mode=via_dto

# Database connection
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/final_project_03}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration (expiration in ms: access 5m, refresh 7 days)
# JWT_SECRET is mandatory and must be provided via environment variable
jwt.secret-key=${JWT_SECRET}
jwt.expired=${JWT_EXPIRATION:300000}
jwt.refresh-expired=${JWT_REFRESH_EXPIRATION:604800000}

# Email Sender (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo_secret}

# File Upload Limits
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.max-file-size=120MB

# Springdoc OpenAPI Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
